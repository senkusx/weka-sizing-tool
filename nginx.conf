server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_types        text/css application/javascript text/javascript application/json;
    gzip_min_length   512;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # nginx only inherits add_header from an outer block when the current block
    # declares none of its own. Because the js/css location below sets
    # Cache-Control, it would silently drop every server-level security header —
    # so the headers live in an include that each location pulls in explicitly.
    location ~* \.(js|css)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        # No client-side routing here, so a missing file is a genuine 404
        # rather than something to rewrite onto index.html.
        try_files $uri $uri/ =404;
    }
}
