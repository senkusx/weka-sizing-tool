# Shared response headers. Included per-location — see the comment in nginx.conf
# for why these cannot simply live at server level.
# The tool is entirely client-side: no request ever carries sizing data off the
# machine, so these exist to harden the page if it is served on a shared network.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
